name: Modified Drools Docs
jobs:
  drools-build:
    concurrency:
      group: pr-drools_docs_${{ matrix.os }}_${{ matrix.java-version }}_${{ matrix.maven-version
        }}_${{ github.head_ref }}
      cancel-in-progress: true
    timeout-minutes: 120
    strategy:
      matrix:
        os:
        - ubuntu-latest
        java-version:
        - 17
        maven-version:
        - 3.9.6
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: drools-build (${{ matrix.os }}, ${{ matrix.java-version }}, ${{ matrix.maven-version
      }})
    steps:
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |-
        python -m pip install --upgrade pip
        pip install inotify
    - name: Run inotifywait
      run: |-
        python3 -c "
        import inotify.adapters
        import inotify.constants
        import os
        from datetime import datetime, timezone
        with open('/home/runner/inotifywait-log-drools-build (${{ matrix.os }}, ${{ matrix.java-version }}, ${{ matrix.maven-version }}).csv', 'w') as log_file:
          i = inotify.adapters.InotifyTree('/home/runner/work/incubator-kie-drools/incubator-kie-drools', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
          for event in i.event_gen(yield_nones=False):
            (_, type_names, path, filename) = event
            now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
            events = ','.join(type_names)
            log_file.write(f'{now};{path};{filename};{events}\n')
            log_file.flush()
            os.fsync(log_file.fileno())
        " &
    - uses: actions/checkout@v3
    - run: touch optcd-3.txt
    - name: Java and Maven Setup
      uses: apache/incubator-kie-kogito-pipelines/.ci/actions/maven@main
      with:
        java-version: ${{ matrix.java-version }}
        maven-version: ${{ matrix.maven-version }}
        cache-key-prefix: ${{ runner.os }}-${{ matrix.java-version }}-maven${{ matrix.maven-version
          }}
        allow-snapshots: true
    - run: touch optcd-4.txt
    - name: Build with Maven
      run: mvn -B clean install --file drools-docs/pom.xml
    - run: touch optcd-5.txt
    - name: Upload inotifywait logs
      uses: actions/upload-artifact@v4
      with:
        name: inotifywait-drools-build (${{ matrix.os }}, ${{ matrix.java-version
          }}, ${{ matrix.maven-version }})
        path: /home/runner/inotifywait-log-drools-build (${{ matrix.os }}, ${{ matrix.java-version
          }}, ${{ matrix.maven-version }}).csv
'on':
- push
- workflow_dispatch
